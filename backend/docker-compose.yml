version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pedigree_db
      POSTGRES_USER: pedigree_admin
      POSTGRES_PASSWORD: localdevpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=pedigree_db
      - DB_USER=pedigree_admin
      - DB_PASSWORD=localdevpassword
      - DB_HOST=db
      - DB_PORT=5432
      - DEBUG=True
    depends_on:
      - db

volumes:
  postgres_data:
