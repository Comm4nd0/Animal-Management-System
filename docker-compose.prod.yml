version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-pedigree_db}
      POSTGRES_USER: ${DB_USER:-pedigree_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pedigree_admin}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Limit resource usage on small instance
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DEBUG=False
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn pedigree_api.wsgi:application
               --bind 0.0.0.0:8000
               --workers 2
               --threads 2
               --timeout 120
               --max-requests 1000
               --max-requests-jitter 50"
    deploy:
      resources:
        limits:
          memory: 768M

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - web

volumes:
  postgres_data:
  static_files:
  media_files:
  certbot_www:
  certbot_conf:
