# ─── Continuous Integration ────────────────────────────────
# Runs on every push and pull request to main/master.
# Tests must pass before a PR can be merged.

name: CI — Test & Lint

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend Tests ──────────────────────────────────────
  backend:
    name: Backend Tests (Django)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_pedigree_db
          POSTGRES_USER: pedigree_admin
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pedigree_admin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        env:
          DB_NAME: test_pedigree_db
          DB_USER: pedigree_admin
          DB_PASSWORD: testpassword
          DB_HOST: localhost
          DB_PORT: 5432
          DEBUG: "True"
          DJANGO_SECRET_KEY: ci-test-secret-key
        run: python manage.py migrate --noinput

      - name: Run tests
        env:
          DB_NAME: test_pedigree_db
          DB_USER: pedigree_admin
          DB_PASSWORD: testpassword
          DB_HOST: localhost
          DB_PORT: 5432
          DEBUG: "True"
          DJANGO_SECRET_KEY: ci-test-secret-key
        run: python manage.py test --verbosity=2

  # ─── Frontend Tests ─────────────────────────────────────
  frontend:
    name: Frontend Tests (Flutter)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test
